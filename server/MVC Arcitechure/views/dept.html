<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Welcome to Depertment Page</h2>
    <form action="/dept" method="post">
      <div>
        <label for="name"> Depertment Name : </label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter Depertment Name"
          required
        />
      </div>
      <div>
        <label for="roll">Depertment Code : </label>
        <input
          type="text"
          name="deptCode"
          id="deptCode"
          placeholder="Enter Depertment Code"
          inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          required
        />
      </div>
      <div>
        <button type="submit">Add</button><button type="reset">Reset</button>
      </div>
    </form>
  </body>
</html>
